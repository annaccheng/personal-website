<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/TabLogo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta
      name="description"
      content="Anna Cheng - Product Manager & Engineer studying Computer Science and Business at UC Berkeley"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Anna Cheng | Product Manager & Engineer</title>
    <style>
      /* Minimal prepaint style to avoid flash */
      html[data-theme="dark"] {
        background: #0a0a0a;
        color-scheme: dark;
      }
      html[data-theme="light"] {
        background: #fafafa;
        color-scheme: light;
      }
    </style>
    <script>
      (function () {
        try {
          const STORAGE_KEY = "theme";
          const saved = localStorage.getItem(STORAGE_KEY);
          const prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          console.warn("Theme initialization failed:", e);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
